[project]
name = "kuakua-agent"
version = "0.1.0"
description = "Kuakua Agent 项目"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite==0.20.0",
    "asyncpg>=0.29.0",
    "fastapi==0.115.0",
    "mcp>=1.6.0",
    "openai>=1.51.0",
    "pydantic>=2.0",
    "pydantic-settings==2.5.2",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette>=1.6,<2.0",
    "uvicorn==0.30.6",
    "pyyaml>=6.0",
    "python-json-logger>=2.0.0",
    "httpx>=0.27.0",
    "bcrypt>=4.0.0",
]

[dependency-groups]
dev = ["mypy>=1.0.0", "ruff>=0.3.0"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
strict = []
reportAttributeAccessIssue = false
reportGeneralTypeIssues = false
reportUnknownMemberType = false
reportArgumentType = false
reportAny = false


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP045", "UP035", "UP015", "B904", "UP046"]
fixable = ["I", "F401", "F541", "UP006", "UP017", "UP041"]

[tool.ruff.format]
quote-style = "double" # 使用双引号，符合工业界标准

