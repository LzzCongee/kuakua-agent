<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夸夸 Agent 测试界面</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #333; margin-bottom: 20px; text-align: center; }
        h2 { color: #555; font-size: 18px; margin: 20px 0 10px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        
        .panel {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 500; margin-bottom: 5px; color: #555; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4a90d9;
            box-shadow: 0 0 0 2px rgba(74,144,217,0.2);
        }
        
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        
        button {
            background: #4a90d9;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover { background: #3a7bc8; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button.secondary { background: #6c757d; }
        button.secondary:hover { background: #5a6268; }
        button.stop { background: #f44336; }
        button.stop:hover { background: #d32f2f; }
        
        .chat-messages {
            border: 1px solid #eee;
            border-radius: 4px;
            min-height: 200px;
            max-height: 600px;
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            background: #fafafa;
            position: relative;
            resize: vertical;
            overflow: auto;
        }
        .resize-handle {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 8px;
            cursor: ns-resize;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to top, rgba(0,0,0,0.05), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .chat-messages:hover .resize-handle {
            opacity: 1;
        }
        .resize-handle::before {
            content: '⋮⋮';
            color: #aaa;
            font-size: 14px;
            letter-spacing: 2px;
        }
        .message {
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .message.user {
            background: #e3f2fd;
            margin-left: 40px;
        }
        .message.assistant {
            background: #fff;
            border: 1px solid #ddd;
            margin-right: 40px;
        }
        .message .label {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }
        
        .session-card {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            background: #fafafa;
        }
        .session-card .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .session-card .header:hover {
            background: #f0f0f0;
            border-radius: 4px;
            margin: -4px;
            padding: 4px 8px;
        }
        .session-card .details {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ddd;
            display: none;
        }
        .session-card .details.expanded {
            display: block;
        }
        .session-card .message-item {
            padding: 8px 12px;
            margin: 8px 0;
            border-radius: 6px;
            font-size: 13px;
        }
        .session-card .message-item.user {
            background: #e3f2fd;
            margin-left: 20px;
        }
        .session-card .message-item.assistant {
            background: #f5f5f5;
            margin-right: 20px;
        }
        .expand-btn {
            background: none;
            border: 1px solid #4a90d9;
            color: #4a90d9;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }
        .expand-btn:hover {
            background: #4a90d9;
            color: #fff;
        }
        .session-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 5px;
        }
        .session-meta span {
            font-size: 12px;
            color: #888;
        }
        .session-messages {
            max-height: 400px;
            overflow-y: auto;
        }
        .tag {
            display: inline-block;
            background: #e3f2fd;
            color: #1976d2;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin: 2px;
        }
        
        .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 15px; }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            color: #666;
        }
        .tab.active {
            border-bottom-color: #4a90d9;
            color: #4a90d9;
            font-weight: 500;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #4a90d9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .status { padding: 8px 12px; border-radius: 4px; margin-bottom: 10px; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.info { background: #d1ecf1; color: #0c5460; }

        /* 图片上传区域 */
        .image-upload-area {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            color: #888;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            margin-bottom: 10px;
            position: relative;
        }
        .image-upload-area:hover, .image-upload-area.dragover {
            border-color: #4a90d9;
            background: #f0f7ff;
        }
        .image-upload-area input[type="file"] {
            display: none;
        }
        .image-upload-area .upload-hint {
            font-size: 13px;
        }
        .image-upload-area .upload-hint kbd {
            background: #eee;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 12px;
            border: 1px solid #ddd;
        }
        .image-preview-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .image-preview-item {
            position: relative;
            display: inline-block;
        }
        .image-preview-item img {
            max-width: 120px;
            max-height: 120px;
            border-radius: 6px;
            border: 1px solid #ddd;
            object-fit: cover;
        }
        .image-preview-item .remove-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            background: #f44336;
            color: #fff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            line-height: 20px;
            text-align: center;
            padding: 0;
        }
        .image-preview-item .remove-btn:hover {
            background: #d32f2f;
        }
        .message .image-indicator {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 6px;
        }

        /* 调试面板 */
        .debug-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 15px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            user-select: none;
        }
        .debug-toggle input[type="checkbox"] {
            width: auto;
            accent-color: #e91e63;
        }
        .debug-panel {
            margin-top: 15px;
            border: 1px solid #e91e63;
            border-radius: 8px;
            background: #fff;
            display: none;
        }
        .debug-panel.active { display: block; }
        .debug-panel .debug-header {
            background: #fce4ec;
            padding: 10px 15px;
            border-radius: 7px 7px 0 0;
            font-weight: 600;
            color: #c2185b;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .debug-section {
            border-top: 1px solid #f8bbd0;
            padding: 12px 15px;
        }
        .debug-section h4 {
            font-size: 13px;
            color: #c2185b;
            margin-bottom: 8px;
            cursor: pointer;
            user-select: none;
        }
        .debug-section h4::before {
            content: '▼ ';
            font-size: 10px;
        }
        .debug-section h4.collapsed::before {
            content: '▶ ';
        }
        .debug-section .debug-content {
            font-size: 12px;
            line-height: 1.5;
        }
        .debug-section .debug-content.collapsed {
            display: none;
        }
        .debug-prompt {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eee;
        }
        .debug-kv {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 4px 10px;
            font-size: 12px;
        }
        .debug-kv .key {
            color: #888;
            text-align: right;
        }
        .debug-kv .key::after { content: ':'; }
        .debug-kv .value { color: #333; }
        .mcp-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .mcp-table th {
            background: #fce4ec;
            padding: 6px 8px;
            text-align: left;
            font-weight: 500;
            color: #c2185b;
        }
        .mcp-table td {
            padding: 6px 8px;
            border-bottom: 1px solid #f8bbd0;
        }
        .mcp-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .mcp-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .mcp-status .dot.green { background: #4caf50; }
        .mcp-status .dot.red { background: #f44336; }
        .tag-list {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .extraction-card {
            background: #f3e5f5;
            border-radius: 6px;
            padding: 10px;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>夸夸 Agent 测试界面</h1>
        
        <!-- 配置面板 -->
        <div class="panel">
            <h2>用户配置</h2>
            <div class="row">
                <div class="col">
                    <div class="form-group">
                        <label>用户名 (User ID)</label>
                        <input type="text" id="userId" placeholder="输入用户名" value="test_user">
                    </div>
                </div>
                <div class="col">
                    <div class="form-group">
                        <label>会话</label>
                        <div style="display:flex;gap:6px;align-items:center;">
                            <select id="sessionSelect" style="flex:1;" onchange="switchSession(this.value)"></select>
                            <button onclick="newSession()" style="padding:10px 12px;white-space:nowrap;background:#6c757d;">新建</button>
                        </div>
                        <input type="hidden" id="sessionId">
                    </div>
                </div>
                <div class="col">
                    <div class="form-group">
                        <label>场景</label>
                        <select id="scene">
                            <option value="general">通用</option>
                            <option value="career">职场/事业</option>
                            <option value="beauty">颜值/气质</option>
                            <option value="love">恋爱</option>
                            <option value="daily">日常</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 对话面板 -->
        <div class="panel">
            <h2>对话测试</h2>
            <div class="form-group">
                <label>输入内容</label>
                <textarea id="chatInput" placeholder="输入你想被夸的内容..."></textarea>
            </div>
            <div class="form-group">
                <label>图片上传（可选）</label>
                <div class="image-upload-area" id="imageUploadArea">
                    <input type="file" id="imageFileInput" accept="image/*" multiple>
                    <div class="upload-hint">
                        点击选择图片、拖拽图片到此处、或按 <kbd>Ctrl+V</kbd> 粘贴
                    </div>
                </div>
                <div class="image-preview-container" id="imagePreviewContainer"></div>
            </div>
            <div class="form-group">
                <label>语音输入（可选）</label>
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <button onclick="toggleAudioRecording()" id="audioBtn" style="background: #e91e63;">
                        🎤 录音
                    </button>
                    <button onclick="playAudio()" id="playBtn" style="background: #9c27b0; display: none;">
                        ▶️ 播放
                    </button>
                    <button onclick="transcribeAudio()" id="transcribeBtn" style="background: #ff9800;">
                        🔄 转写测试
                    </button>
                    <select id="audioFormat" style="width: auto;">
                        <option value="mp3" selected>MP3 (推荐)</option>
                        <option value="wav">WAV</option>
                        <option value="m4a">M4A</option>
                        <option value="ogg">OGG</option>
                        <option value="webm">WEBM</option>
                    </select>
                    <span id="audioStatus" style="font-size: 13px; color: #888;"></span>
                </div>
                <input type="hidden" id="audioData" value="">
            </div>
            <div class="row">
                <div class="col">
                    <button onclick="sendChat()" id="sendBtn">发送消息</button>
                    <button class="secondary" onclick="sendStream()" id="streamBtn">流式输出</button>
                    <button class="stop" onclick="stopGeneration()" id="stopBtn" style="display:none;">停止回复</button>
                    <label class="debug-toggle">
                        <input type="checkbox" id="debugMode"> 调试模式
                    </label>
                </div>
            </div>
            
            <h3 style="margin: 20px 0 10px;">
                对话历史 
                <span style="font-size: 12px; color: #888; font-weight: normal;">（拖拽边缘调整高度）</span>
            </h3>
            <div class="chat-messages" id="chatMessages">
                <div style="color: #888; text-align: center; padding: 40px;">
                    对话内容将显示在这里<br>
                    <span style="font-size: 12px;">拖动底部边框可调整高度</span>
                </div>
                <div class="resize-handle"></div>
            </div>

            <!-- 调试面板 -->
            <div class="debug-panel" id="debugPanel">
                <div class="debug-header">
                    <span>调试信息</span>
                    <span id="debugTimestamp" style="font-size:12px;font-weight:normal;"></span>
                </div>

                <div class="debug-section">
                    <h4 onclick="toggleDebugSection(this)">Prompt 构建</h4>
                    <div class="debug-content">
                        <div class="debug-kv" id="debugPromptMeta"></div>
                        <div class="debug-prompt" id="debugSystemPrompt" style="margin-top:8px;"></div>
                    </div>
                </div>

                <div class="debug-section">
                    <h4 class="collapsed" onclick="toggleDebugSection(this)">最终 Prompt（发给模型）</h4>
                    <div class="debug-content collapsed" id="debugFinalPrompt" style="white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.5;max-height:500px;overflow-y:auto;background:#f8f8f8;padding:10px;border-radius:4px;"></div>
                </div>

                <div class="debug-section">
                    <h4 onclick="toggleDebugSection(this)">记忆注入</h4>
                    <div class="debug-content" id="debugMemory"></div>
                </div>

                <div class="debug-section">
                    <h4 onclick="toggleDebugSection(this)">MCP 服务</h4>
                    <div class="debug-content" id="debugMCP"></div>
                </div>

                <div class="debug-section">
                    <h4 onclick="toggleDebugSection(this)">记忆提取</h4>
                    <div class="debug-content" id="debugExtraction"></div>
                </div>
            </div>
        </div>
        
        <!-- ��忆管理面板 -->
        <div class="panel">
            <h2>记忆管理测试</h2>
            <div class="tabs">
                <div class="tab active" onclick="switchTab('profile')">用户偏好</div>
                <div class="tab" onclick="switchTab('summary')">记忆汇总</div>
                <div class="tab" onclick="switchTab('milestones')">里程碑</div>
                <div class="tab" onclick="switchTab('sessions')">会话历史</div>
            </div>
            
            <div class="tab-content active" id="tab-profile">
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label>偏好场景</label>
                            <select id="preferScene">
                                <option value="">请选择</option>
                                <option value="general">通用</option>
                                <option value="career">职场/事业</option>
                                <option value="beauty">颜值/气质</option>
                                <option value="love">恋爱</option>
                                <option value="daily">日常</option>
                            </select>
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label>偏好风格</label>
                            <input type="text" id="preferStyle" placeholder="如：文艺、幽默、真诚">
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label>用户标签</label>
                            <input type="text" id="userTags" placeholder="用逗号分隔，如：程序员,跑步">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label>避免词汇</label>
                            <input type="text" id="avoidWords" placeholder="用逗号分隔">
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label>最近情绪</label>
                            <input type="text" id="lastEmotion" placeholder="如：开心、焦虑">
                        </div>
                    </div>
                </div>
                <div class="row" style="margin-top: 10px;">
                    <div class="col">
                        <div class="form-group">
                            <label>人格偏好</label>
                            <select id="personalityPrefer">
                                <option value="default">默认（温暖真诚）</option>
                                <option value="witty">毒舌吐槽（嘴贱心暖）</option>
                                <option value="chill">淡定慵懒（话少精准）</option>
                                <option value="enthusiastic">热血中二（夸张戏精）</option>
                            </select>
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label>幽默偏好</label>
                            <select id="humorTaste">
                                <option value="">请选择</option>
                                <option value="teasing">调侃毒舌</option>
                                <option value="insightful">洞察深度</option>
                                <option value="meme">玩梗段子</option>
                                <option value="ironic">反差暖心</option>
                            </select>
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label class="debug-toggle" style="margin-left:0;">
                                <input type="checkbox" id="toneShift" checked> 接受语气变化
                            </label>
                            <div style="font-size:12px;color:#888;margin-top:4px;">勾选：AI 可能会搞怪/调侃/不按套路出牌</div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <button onclick="getProfile()">查询偏好</button>
                    <button onclick="updateProfile()">更新偏好</button>
                </div>
                <div id="profileResult" style="margin-top: 15px;"></div>
            </div>
            
            <div class="tab-content" id="tab-summary">
                <button onclick="getSummary()">查询记忆汇总</button>
                <div id="summaryResult" style="margin-top: 15px;"></div>
            </div>
            
            <div class="tab-content" id="tab-milestones">
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label>里程碑内容</label>
                            <input type="text" id="milestoneContent" placeholder="输入成就内容">
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label>重要性 (1-5)</label>
                            <select id="milestoneImportance">
                                <option value="1">1 - 低</option>
                                <option value="2" selected>2 - 中</option>
                                <option value="3">3 - 较高</option>
                                <option value="4">4 - 高</option>
                                <option value="5">5 - 很高</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <button onclick="getMilestones()">查询里程碑</button>
                    <button onclick="addMilestone()">添加里程碑</button>
                    <button onclick="extractMilestone()">从输入提取</button>
                </div>
                <div id="milestonesResult" style="margin-top: 15px;"></div>
            </div>
            
            <div class="tab-content" id="tab-sessions">
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label>会话数量限制</label>
                            <select id="sessionLimit">
                                <option value="5">最近 5 条</option>
                                <option value="10" selected>最近 10 条</option>

    <script>
        const API_BASE = '';
        let currentUserId = 'test_user';
        let pendingImages = [];  // 存储待发送的图片 base64 数据
        let currentAbortController = null;  // 用于取消流式请求
        let isGenerating = false;

        // ========== 图片上传处理 ==========
        function initImageUpload() {
            const area = document.getElementById('imageUploadArea');
            const fileInput = document.getElementById('imageFileInput');

            // 点击选择文件
            area.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
                fileInput.value = '';
            });

            // 拖拽
            area.addEventListener('dragover', (e) => {
                e.preventDefault();
                area.classList.add('dragover');
            });
            area.addEventListener('dragleave', () => area.classList.remove('dragover'));
            area.addEventListener('drop', (e) => {
                e.preventDefault();
                area.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });

            // 粘贴（全局监听，输入框聚焦时也能粘贴）
            document.addEventListener('paste', (e) => {
                const items = e.clipboardData?.items;
                if (!items) return;
                for (const item of items) {
                    if (item.type.startsWith('image/')) {
                        e.preventDefault();
                        handleFiles([item.getAsFile()]);
                        break;
                    }
                }
            });
        }

        function handleFiles(files) {
            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;
                if (pendingImages.length >= 3) {
                    alert('最多上传 3 张图片');
                    break;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    pendingImages.push(e.target.result);
                    renderImagePreviews();
                };
                reader.readAsDataURL(file);
            }
        }

        function renderImagePreviews() {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = '';
            pendingImages.forEach((dataUrl, index) => {
                const item = document.createElement('div');
                item.className = 'image-preview-item';
                item.innerHTML = `
                    <img src="${dataUrl}" alt="预览">
                    <button class="remove-btn" onclick="removeImage(${index})">&times;</button>
                `;
                container.appendChild(item);
            });
        }

        function removeImage(index) {
            pendingImages.splice(index, 1);
            renderImagePreviews();
        }

        function clearImages() {
            pendingImages = [];
            renderImagePreviews();
        }

        // ========== 音频录制 ==========
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        function toggleAudioRecording() {
            if (isRecording) {
                stopAudioRecording();
            } else {
                startAudioRecording();
            }
        }

        async function startAudioRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const selectedFormat = document.getElementById('audioFormat').value;
                // API 只支持 mp3/wav/m4a 格式，base64 输入不支持 webm/ogg
                // 优先级：mp3 > wav > m4a > webm > ogg

                // 优先尝试用户选择的格式
                const userSelectedMime = `audio/${selectedFormat}`;
                const mimeTypes = [
                    userSelectedMime,  // 优先用户选择
                    'audio/wav',       // API 支持，通用性好
                    'audio/mp4',       // API 支持
                    'audio/m4a',      // API 支持
                    'audio/webm',      // API 不支持（错误日志确认）
                    'audio/ogg',       // API 不支持（错误日志确认）
                    'audio/webm;codecs=opus',  // 常见降级
                ];

                // 尝试找到支持的格式
                let mimeType = '';
                for (const mt of mimeTypes) {
                    if (MediaRecorder.isTypeSupported(mt)) {
                        mimeType = mt;
                        const isUserSelected = mt === userSelectedMime;
                        console.log(`录音格式: ${mt} ${isUserSelected ? '(用户选择)' : '(自动降级)'}`);
                        break;
                    }
                }

                // 如果都没找到，使用浏览器默认
                if (!mimeType) {
                    console.log('无可用录音格式，使用浏览器默认');
                }

                const config = mimeType ? { mimeType } : {};
                mediaRecorder = new MediaRecorder(stream, config);
                console.log('MediaRecorder 最终 MIME:', mediaRecorder.mimeType || 'browser-default');
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        audioChunks.push(e.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    // 使用 MediaRecorder 的实际 MIME 类型创建 Blob
                    const mimeType = mediaRecorder.mimeType || 'audio/webm';
                    const audioBlob = new Blob(audioChunks, { type: mimeType });
                    console.log('原始录音 MIME:', mimeType, '大小:', audioBlob.size);

                    // API 只支持 mp3/wav/m4a，需要转换不支持的格式
                    const needConvert = !['audio/wav', 'audio/mp3', 'audio/mp4', 'audio/m4a'].includes(mimeType);
                    let dataUrl;

                    if (needConvert) {
                        console.log('需要转换格式:', mimeType, '-> audio/wav');
                        try {
                            dataUrl = await convertToWav(audioBlob);
                            console.log('转换成功, dataUrl length:', dataUrl.length);
                        } catch (e) {
                            console.error('格式转换失败，使用原始格式:', e);
                            // 转换失败则使用原始格式
                            const reader = new FileReader();
                            dataUrl = await new Promise((resolve) => {
                                reader.onload = (e) => resolve(e.target.result);
                                reader.readAsDataURL(audioBlob);
                            });
                        }
                    } else {
                        const reader = new FileReader();
                        dataUrl = await new Promise((resolve) => {
                            reader.onload = (e) => resolve(e.target.result);
                            reader.readAsDataURL(audioBlob);
                        });
                    }

                    // 验证 data URL 格式
                    const formatMatch = dataUrl.match(/^data:audio\/([^;]+);base64,/);
                    const actualFormat = formatMatch ? formatMatch[1] : 'unknown';
                    console.log('最终音频格式:', actualFormat, 'dataUrl length:', dataUrl.length);

                    if (!formatMatch) {
                        console.error('Invalid audio data URL - no audio/* prefix');
                    }

                    document.getElementById('audioData').value = dataUrl;
                    const displayFormat = formatMatch ? formatMatch[1].toUpperCase() : 'UNKNOWN';
                    document.getElementById('audioStatus').textContent =
                        `录音完成 (${displayFormat})`;
                    document.getElementById('playBtn').style.display = '';

                    // 停止所有 track
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start(1000);  // 每秒触发 ondataavailable
                isRecording = true;
                document.getElementById('audioBtn').textContent = '⏹ 停止';
                document.getElementById('audioBtn').style.background = '#f44336';
                document.getElementById('audioStatus').textContent = `录音中 (${mediaRecorder.mimeType.split('/')[1].toUpperCase()})...`;
                document.getElementById('playBtn').style.display = 'none';
            } catch (e) {
                alert('无法访问麦克风: ' + e.message);
            }
        }

        function stopAudioRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('audioBtn').textContent = '🎤 录音';
                document.getElementById('audioBtn').style.background = '#e91e63';
            }
        }

        function clearAudio() {
            document.getElementById('audioData').value = '';
            document.getElementById('audioStatus').textContent = '';
            audioChunks = [];
            document.getElementById('playBtn').style.display = 'none';
        }

        function playAudio() {
            const audioData = document.getElementById('audioData').value;
            if (!audioData) {
                alert('没有可播放的音频');
                return;
            }
            const audio = new Audio(audioData);
            audio.oncanplaythrough = () => {
                console.log('Audio ready to play fully');
                audio.play().catch(e => {
                    console.error('Play failed:', e);
                    alert('播放失败: ' + e.message);
                });
            };
            audio.onerror = (e) => {
                console.error('Audio error:', e);
                alert('音频加载失败，请检查录音是否正常');
            };
        }

        // ========== ASR 转写 ==========
        /**
         * 使用 Web Audio API 将音频转换为 WAV 格式
         * @param {Blob} audioBlob - 原始音频 Blob
         * @returns {Promise<string>} - WAV 格式的 data URL
         */
        async function convertToWav(audioBlob) {
            return new Promise((resolve, reject) => {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();

                // 解码音频数据（audioBlob.arrayBuffer() 返回 Promise）
                audioBlob.arrayBuffer()
                    .then((arrayBuffer) => {
                        return audioContext.decodeAudioData(arrayBuffer);
                    })
                    .then((audioBuffer) => {
                        console.log('音频解码成功，时长:', audioBuffer.duration, '秒', '采样率:', audioBuffer.sampleRate);

                        // 转换为 WAV 格式
                        const wavDataUrl = audioBufferToWav(audioBuffer);
                        audioContext.close();
                        resolve(wavDataUrl);
                    })
                    .catch((e) => {
                        console.error('音频解码失败:', e);
                        audioContext.close();
                        reject(e);
                    });
            });
        }

        /**
         * 将 AudioBuffer 转换为 WAV 格式的 data URL
         * @param {AudioBuffer} audioBuffer - 解码后的音频 buffer
         * @returns {string} - WAV 格式的 data URL
         */
        function audioBufferToWav(audioBuffer) {
            const numChannels = audioBuffer.numberOfChannels || 1;
            const sampleRate = audioBuffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;

            // 获取音频数据
            let interleaved;
            if (numChannels === 2) {
                const left = audioBuffer.getChannelData(0);
                const right = audioBuffer.getChannelData(1);
                interleaved = new Float32Array(left.length + right.length);
                for (let i = 0; i < left.length; i++) {
                    interleaved[i * 2] = left[i];
                    interleaved[i * 2 + 1] = right[i];
                }
            } else {
                interleaved = audioBuffer.getChannelData(0);
            }

            // 创建 WAV 文件
            const dataLength = interleaved.length * (bitDepth / 8);
            const buffer = new ArrayBuffer(44 + dataLength);
            const view = new DataView(buffer);

            // RIFF 头
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataLength, true);
            writeString(view, 8, 'WAVE');

            // fmt 子 chunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); // subchunk1 size
            view.setUint16(20, format, true); // audio format (1 = PCM)
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * (bitDepth / 8), true); // byte rate
            view.setUint16(32, numChannels * (bitDepth / 8), true); // block align
            view.setUint16(34, bitDepth, true);

            // data 子 chunk
            writeString(view, 36, 'data');
            view.setUint32(40, dataLength, true);

            // 写入 PCM 数据
            const offset = 44;
            for (let i = 0; i < interleaved.length; i++) {
                const sample = Math.max(-1, Math.min(1, interleaved[i]));
                view.setInt16(offset + i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
            }

            // 转换为 base64
            const bytes = new Uint8Array(buffer);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            const base64 = btoa(binary);

            return `data:audio/wav;base64,${base64}`;
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        function extractBase64FromDataUrl(dataUrl) {
            // 从 data:audio/ogg;base64,xxxxx 中提取 base64 部分
            const parts = dataUrl.split(',');
            return parts.length > 1 ? parts[1] : dataUrl;
        }

        async function transcribeAudio() {
            const audioData = document.getElementById('audioData').value;
            if (!audioData) {
                alert('请先录音');
                return;
            }

            const userId = getUserId();
            const withEmotion = true; // 测试带情绪的版本

            const btn = document.getElementById('transcribeBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>转写中...';

            try {
                // 发送完整 data URL，让 API 自己推断格式
                const audioData = document.getElementById('audioData').value;

                const url = `${API_BASE}/api/asr?with_emotion=${withEmotion}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-ID': userId
                    },
                    body: JSON.stringify({ audio: audioData })
                });

                const data = await res.json();

                if (data.code === 0 && data.data) {
                    const result = data.data;
                    let msg = `转写结果: ${result.text}`;
                    if (result.emotion) {
                        msg += `\n情绪: ${result.emotion} (置信度: ${result.confidence})`;
                    }
                    alert(msg);
                } else {
                    alert(`转写失败: ${data.message}`);
                }
            } catch (e) {
                alert(`请求失败: ${e.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🔄 转写测试';
            }
        }

        function getUserId() {
            return document.getElementById('userId').value || 'anonymous';
        }

        function getSessionId() {
            return document.getElementById('sessionId').value || `session_${getUserId()}`;
        }

        function showStatus(elemId, message, type) {
            const el = document.getElementById(elemId);
            el.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        function showError(elemId, error) {
            showStatus(elemId, `错误: ${error}`, 'error');
        }

        // ========== 会话切换器 ==========
        async function loadSessionList() {
            const userId = getUserId();
            const select = document.getElementById('sessionSelect');
            const currentSid = document.getElementById('sessionId').value;
            try {
                const res = await fetch(`${API_BASE}/api/memory/sessions?limit=20`, {
                    headers: { 'X-User-ID': userId }
                });
                const data = await res.json();
                let options = '';
                if (data.code === 0 && data.data && data.data.length) {
                    data.data.forEach(s => {
                        const label = `${s.session_id} (${s.message_count || 0}条)`;
                        const selected = s.session_id === currentSid ? 'selected' : '';
                        options += `<option value="${s.session_id}" ${selected}>${label}</option>`;
                    });
                }
                // 确保当前 session_id 在列表中
                if (currentSid && !options.includes(`value="${currentSid}"`)) {
                    options = `<option value="${currentSid}" selected>${currentSid} (0条)</option>` + options;
                }
                select.innerHTML = options || `<option value="${currentSid}">${currentSid}</option>`;
            } catch (e) {
                select.innerHTML = `<option value="${currentSid}">${currentSid}</option>`;
            }
        }

        function switchSession(sid) {
            document.getElementById('sessionId').value = sid;
        }

        function newSession() {
            const userId = getUserId();
            const sid = `session_${userId}_${Date.now()}`;
            document.getElementById('sessionId').value = sid;
            const select = document.getElementById('sessionSelect');
            const opt = document.createElement('option');
            opt.value = sid;
            opt.textContent = `${sid} (新建)`;
            opt.selected = true;
            select.insertBefore(opt, select.firstChild);
        }

        // userId 变化时刷新会话列表
        document.getElementById('userId').addEventListener('input', function () {
            document.getElementById('sessionId').value = `session_${this.value || 'anonymous'}`;
            loadSessionList();
        });

        function initSession() {
            currentUserId = getUserId();
            document.getElementById('sessionId').value = `session_${currentUserId}`;
            loadSessionList();
        }
        
        // 切换标签页
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }
        
        // ========== 对话功能 ==========
        // ========== 停止生成 ==========
        function stopGeneration() {
            if (currentAbortController) {
                currentAbortController.abort();
                currentAbortController = null;
            }
        }

        function setGeneratingState(generating) {
            isGenerating = generating;
            const sendBtn = document.getElementById('sendBtn');
            const streamBtn = document.getElementById('streamBtn');
            const stopBtn = document.getElementById('stopBtn');
            if (generating) {
                sendBtn.disabled = true;
                streamBtn.disabled = true;
                stopBtn.style.display = '';
            } else {
                sendBtn.disabled = false;
                streamBtn.disabled = false;
                stopBtn.style.display = 'none';
                currentAbortController = null;
            }
        }

        async function sendChat() {
            const userId = getUserId();
            const sessionId = getSessionId();
            let text = document.getElementById('chatInput').value.trim();
            const scene = document.getElementById('scene').value;
            const hasImage = pendingImages.length > 0;
            const hasAudio = document.getElementById('audioData').value.length > 0;
            let audioData = hasAudio ? document.getElementById('audioData').value : null;
            const debug = isDebugMode();

            if (!text && !hasImage && !hasAudio) {
                alert('请输入内容、上传图片或录音');
                return;
            }

            setGeneratingState(true);
            const btn = document.getElementById('sendBtn');
            btn.innerHTML = '<span class="loading"></span>发送中...';

            // 如果只有音频没有文字，先调用 ASR 获取转写
            if (!text && hasAudio) {
                try {
                    const asrResult = await callAsrApi(audioData, userId, true);
                    if (asrResult && asrResult.text) {
                        text = asrResult.text;
                        document.getElementById('chatInput').value = text;
                        // 显示转写结果给用户
                        appendMessage('user', `[语音] ${text}`, hasImage);
                    } else {
                        alert('语音识别未返回文字，请使用文字输入');
                        setGeneratingState(false);
                        btn.innerHTML = '发送消息';
                        return;
                    }
                } catch (e) {
                    alert('语音识别失败: ' + e.message);
                    setGeneratingState(false);
                    btn.innerHTML = '发送消息';
                    return;
                }
            }

            // 构建请求体：图片取第一张，音频如果有就附带
            const body = { scene };
            if (text) body.text = text;
            if (hasImage) body.image = pendingImages[0];
            // 不再发送 audio，因为已经转换为文字

            try {
                let url = `${API_BASE}/api/chat?session_id=${sessionId}`;
                if (debug) url += '&debug=true';

                const res = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-ID': userId
                    },
                    body: JSON.stringify(body)
                });

                const data = await res.json();

                // 调试模式下，即使有错误也尝试渲染调试面板
                if (debug && data.data && data.data.debug) {
                    renderDebugPanel(data.data.debug);
                }

                if (data.code === 0) {
                    // 文字已通过 ASR 转写显示，不需要再显示
                    // 只显示 AI 回复
                    appendMessage('assistant', data.data.content);
                    document.getElementById('chatInput').value = '';
                    clearImages();
                    clearAudio();
                } else {
                    // 调试模式下如果有部分内容，不弹 alert
                    if (debug && data.data && data.data.debug) {
                        appendMessage('assistant', data.data.content || `[错误] ${data.message}`);
                    } else {
                        alert(`错误: ${data.message}`);
                    }
                }
            } catch (e) {
                alert(`请求失败: ${e.message}`);
            } finally {
                setGeneratingState(false);
                btn.innerHTML = '发送消息';
            }
        }

        /**
         * 调用 ASR 接口获取语音转写
         */
        async function callAsrApi(audioData, userId, withEmotion = false) {
            const url = `${API_BASE}/api/asr?with_emotion=${withEmotion}`;
            const res = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-User-ID': userId
                },
                body: JSON.stringify({ audio: audioData })
            });
            const data = await res.json();
            if (data.code === 0 && data.data) {
                return data.data;
            }
            throw new Error(data.message || 'ASR 失败');
        }
        
        async function sendStream() {
            const userId = getUserId();
            const sessionId = getSessionId();
            let text = document.getElementById('chatInput').value.trim();
            const scene = document.getElementById('scene').value;
            const hasImage = pendingImages.length > 0;
            const hasAudio = document.getElementById('audioData').value.length > 0;
            let audioData = hasAudio ? document.getElementById('audioData').value : null;
            const debug = isDebugMode();

            if (!text && !hasImage && !hasAudio) {
                alert('请输入内容、上传图片或录音');
                return;
            }

            // 如果只有音频没有文字，先调用 ASR 获取转写
            if (!text && hasAudio) {
                try {
                    const asrResult = await callAsrApi(audioData, userId, true);
                    if (asrResult && asrResult.text) {
                        text = asrResult.text;
                        document.getElementById('chatInput').value = text;
                    } else {
                        alert('语音识别未返回文字，请使用文字输入');
                        return;
                    }
                } catch (e) {
                    alert('语音识别失败: ' + e.message);
                    return;
                }
            }

            appendMessage('user', text, hasImage);
            appendMessage('assistant', '...');

            const body = { scene };
            if (text) body.text = text;
            if (hasImage) body.image = pendingImages[0];
            // 不再发送 audio，因为已经转换为文字

            // 创建 AbortController 用于停止请求
            currentAbortController = new AbortController();
            setGeneratingState(true);

            let content = '';
            let stopped = false;
            let debugData = null;
            let lastMsg = document.querySelector('.message.assistant:last-child .content');

            try {
                let url = `${API_BASE}/api/chat/stream?session_id=${sessionId}`;
                if (debug) url += '&debug=true';

                const res = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-ID': userId
                    },
                    body: JSON.stringify(body),
                    signal: currentAbortController.signal,
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let currentEvent = '';
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();  // 保留不完整的行

                    for (const line of lines) {
                        if (line.startsWith('event: ')) {
                            currentEvent = line.slice(7).trim();
                        } else if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (currentEvent === 'chunk' && data.content) {
                                    content += data.content;
                                    if (lastMsg) lastMsg.textContent = content;
                                } else if (currentEvent === 'debug') {
                                    debugData = data;
                                } else if (currentEvent === 'error') {
                                    const errMsg = data.message || '生成失败';
                                    if (lastMsg) lastMsg.textContent = content || errMsg;
                                    appendErrorNote(lastMsg, errMsg);
                                }
                            } catch (e) {}
                        }
                    }
                }
                clearImages();
                clearAudio();
                // 渲染调试面板
                if (debug && debugData) {
                    renderDebugPanel(debugData);
                }
            } catch (e) {
                if (e.name === 'AbortError') {
                    stopped = true;
                    if (lastMsg && content) {
                        appendErrorNote(lastMsg, '已停止回复');
                    } else if (lastMsg) {
                        lastMsg.textContent = '（已取消）';
                    }
                } else {
                    if (lastMsg) lastMsg.textContent = `请求失败: ${e.message}`;
                }
            } finally {
                setGeneratingState(false);
                if (content && stopped) {
                    document.getElementById('chatInput').value = '';
                }
            }
        }

        function appendErrorNote(msgEl, text) {
            if (!msgEl) return;
            const note = document.createElement('div');
            note.style.cssText = 'color:#f44336;font-size:12px;margin-top:4px;';
            note.textContent = text;
            msgEl.parentElement.appendChild(note);
        }

        function appendMessage(role, content, hasImage = false) {
            const container = document.getElementById('chatMessages');
            const empty = container.querySelector('div[style*="text-align: center"]');
            if (empty) empty.remove();

            const div = document.createElement('div');
            div.className = `message ${role}`;
            const imageTag = hasImage ? '<span class="image-indicator">含图片</span>' : '';
            div.innerHTML = `<div class="label">${role === 'user' ? '你' : '夸夸 Agent'}${imageTag}</div><div class="content">${content}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

                    headers: { 'X-User-ID': userId }

                    html += `<p><strong>偏好风格:</strong> ${p.prefer_style || '-'}</p>`;

                    html += `<p><strong>避免词汇:</strong> ${(p.avoid_words || []).join(', ') || '-'}</p>`;

        async function updateProfile() {

            const preferStyle = document.getElementById('preferStyle').value || null;
            const userTags = document.getElementById('userTags').value.split(',').map(t => t.trim()).filter(t => t);
            const avoidWords = document.getElementById('avoidWords').value.split(',').map(t => t.trim()).filter(t => t);
            const lastEmotion = document.getElementById('lastEmotion').value || null;
            const personalityPrefer = document.getElementById('personalityPrefer').value || null;
            const humorTaste = document.getElementById('humorTaste').value || null;
            const toneShift = document.getElementById('toneShift').checked;

            try {
                const res = await fetch(`${API_BASE}/api/memory/profile`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-ID': userId
                    },
                    body: JSON.stringify({
                        prefer_scene: preferScene,
                        prefer_style: preferStyle,
                        user_tags: userTags.length ? userTags : null,
                        avoid_words: avoidWords.length ? avoidWords : null,
                        last_emotion: lastEmotion,
                        personality_prefer: personalityPrefer,
                        humor_taste: humorTaste,
                        tone_shift: toneShift,
                    })
                });

                const data = await res.json();
                if (data.code === 0) {
                    showStatus('profileResult', '偏好更新成功', 'success');
                } else {
                    showError('profileResult', data.message);
                }
            } catch (e) {
                showError('profileResult', e.message);
            }

                    html += `<p><strong>人格偏好:</strong> ${s.personality_prefer || 'default'}</p>`;

            const userId = getUserId();

                const res = await fetch(`${API_BASE}/api/memory/milestones`, {

                showError('milestonesResult', e.message);
            }

        async function addMilestone() {
            const userId = getUserId();
            const content = document.getElementById('milestoneContent').value.trim();
            const importance = parseInt(document.getElementById('milestoneImportance').value);
            
            if (!content) {
                alert('请输入里程碑内容');
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/api/memory/milestones`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-ID': userId
                    },
                    body: JSON.stringify({
                        content,
                        source: 'manual',
                        importance
                    })
                });
                
                const data = await res.json();
                if (data.code === 0) {
                    showStatus('milestonesResult', '里程碑添加成功', 'success');
                } else {
                    showError('milestonesResult', data.message);
                }
            } catch (e) {
                showError('milestonesResult', e.message);
            }
        }
        
        async function extractMilestone() {
            const userId = getUserId();
            const content = document.getElementById('chatInput').value.trim();
            
            if (!content) {
                alert('请先在输入框输入内容');
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/api/memory/milestones/extract?content=${encodeURIComponent(content)}`, {
                    method: 'POST',
                    headers: { 'X-User-ID': userId }
                });
                
                const data = await res.json();
                if (data.code === 0 && data.data) {
                    showStatus('milestonesResult', `提取成功: ${data.data.content}`, 'success');
                } else {
                    showStatus('milestonesResult', data.message || '未检测到成就内容', 'info');
                }
            } catch (e) {
                showError('milestonesResult', e.message);
            }
        }
        
        // ========== 会话历史 ==========
        async function getSessions() {
            const userId = getUserId();
            const limit = document.getElementById('sessionLimit').value;
            const currentOnly = document.getElementById('currentSessionOnly').checked;
            const sessionId = currentOnly ? getSessionId() : null;
            try {
                let url = `${API_BASE}/api/memory/sessions?limit=${limit}`;
                if (sessionId) url += `&session_id=${encodeURIComponent(sessionId)}`;
                const res = await fetch(url, {
                    headers: { 'X-User-ID': userId }
                });
                const data = await res.json();
                
                if (data.code === 0 && data.data && data.data.length) {
                    let html = '';
                    data.data.forEach(s => {
                        html += `
                        <div class="session-card" id="session-${s.session_id}">
                            <div class="header" onclick="toggleSession('${s.session_id}')">
                                <div>
                                    <strong>${s.session_id}</strong>
                                    <div class="session-meta">
                                        <span>消息数: ${s.message_count || 0}</span>
                                        <span>创建: ${formatTime(s.created_at)}</span>
                                        <span>更新: ${formatTime(s.last_message_at || s.updated_at)}</span>
                                    </div>
                                </div>
                                <button class="expand-btn" id="btn-${s.session_id}">展开消息</button>
                            </div>
                            <div class="details" id="details-${s.session_id}">
                                <div class="session-messages" id="messages-${s.session_id}">
                                    <div style="color: #888; text-align: center; padding: 20px;">
                                        <span class="loading"></span>加载中...
                                    </div>
                                </div>
                            </div>
                        </div>
                        `;
                    });
                    document.getElementById('sessionsResult').innerHTML = html;
                } else {
                    showStatus('sessionsResult', '暂无会话历史', 'info');
                }
            } catch (e) {
                showError('sessionsResult', e.message);
            }
        }
        
        function formatTime(isoString) {
            if (!isoString) return '-';
            try {
                const date = new Date(isoString);
                return date.toLocaleString('zh-CN', {
                    month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit'
                });
            } catch {
                return isoString;
            }
        }
        
        async function toggleSession(sessionId) {
            const details = document.getElementById(`details-${sessionId}`);
            const btn = document.getElementById(`btn-${sessionId}`);
            const isExpanded = details.classList.contains('expanded');
            
            if (isExpanded) {
                details.classList.remove('expanded');
                btn.textContent = '展开消息';
            } else {
                details.classList.add('expanded');
                btn.textContent = '收起消息';
                // 如果还没有加载过消息，则加载
                const msgContainer = document.getElementById(`messages-${sessionId}`);
                if (msgContainer.querySelector('.loading')) {
                    await loadSessionMessages(sessionId);
                }
            }
        }
        
        async function loadSessionMessages(sessionId) {
            const userId = getUserId();
            const msgContainer = document.getElementById(`messages-${sessionId}`);
            
            try {
                const res = await fetch(`${API_BASE}/api/memory/sessions/detail/${sessionId}`, {
                    headers: { 'X-User-ID': userId }
                });
                const data = await res.json();
                
                if (data.code === 0 && data.data) {
                    const session = data.data;
                    if (session.messages && session.messages.length) {
                        let html = '';
                        session.messages.forEach(m => {
                            const role = m.role === 'user' ? '你' : '夸夸';
                            const roleClass = m.role === 'user' ? 'user' : 'assistant';
                            const content = m.content || '';
                            html += `<div class="message-item ${roleClass}">
                                <strong>${role}:</strong> ${escapeHtml(content)}
                            </div>`;
                        });
                        msgContainer.innerHTML = html;
                    } else {
                        msgContainer.innerHTML = '<div style="color: #888; text-align: center; padding: 20px;">暂无消息</div>';
                    }
                } else {
                    msgContainer.innerHTML = '<div style="color: #f44336; text-align: center; padding: 20px;">加载失败</div>';
                }
            } catch (e) {
                msgContainer.innerHTML = `<div style="color: #f44336; text-align: center; padding: 20px;">加载失败: ${e.message}</div>`;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function clearSessions() {
            document.getElementById('sessionsResult').innerHTML = '';
        }
        
        // ========== 调试面板 ==========
        function isDebugMode() {
            return document.getElementById('debugMode').checked;
        }

        function toggleDebugSection(header) {
            header.classList.toggle('collapsed');
            const content = header.nextElementSibling;
            content.classList.toggle('collapsed');
        }

        function renderDebugPanel(debug) {
            if (!debug) return;

            const panel = document.getElementById('debugPanel');
            panel.classList.add('active');

            // 时间戳
            document.getElementById('debugTimestamp').textContent =
                new Date().toLocaleTimeString('zh-CN');

            // Prompt 构建
            document.getElementById('debugPromptMeta').innerHTML = `
                <span class="key">来源</span><span class="value">${debug.prompt_source}</span>
                <span class="key">输入类型</span><span class="value">${debug.input_type}</span>
                <span class="key">用户消息</span><span class="value">${escapeHtml(debug.user_message || '(无)')}</span>
            `;
            document.getElementById('debugSystemPrompt').textContent = debug.system_prompt;

            // 最终 Prompt（发给模型的完整内容）
            const finalPrompt = `[system]\n${debug.system_prompt}\n\n[user]\n${debug.user_message || ''}`;
            document.getElementById('debugFinalPrompt').textContent = finalPrompt;

            // 记忆注入
            const mem = debug.memory_summary;
            const memContainer = document.getElementById('debugMemory');
            if (mem) {
                let memHtml = '<div class="debug-kv">';
                memHtml += `<span class="key">偏好场景</span><span class="value">${mem.prefer_scene || '-'}</span>`;
                memHtml += `<span class="key">偏好风格</span><span class="value">${mem.prefer_style || '-'}</span>`;
                memHtml += `<span class="key">用户标签</span><span class="value"><span class="tag-list">${(mem.user_tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</span></span>`;
                memHtml += `<span class="key">当前情绪</span><span class="value">${mem.last_emotion || '-'}</span>`;
                memHtml += `<span class="key">高光时刻</span><span class="value">${(mem.milestones || []).map(m => escapeHtml(m)).join('; ') || '-'}</span>`;
                memHtml += `<span class="key">语义记忆</span><span class="value">${(mem.semantic_memories || []).map(m => escapeHtml(m)).join('; ') || '-'}</span>`;
                memHtml += `<span class="key">人格偏好</span><span class="value">${mem.personality_prefer || 'default'}</span>`;
                memHtml += `<span class="key">幽默偏好</span><span class="value">${mem.humor_taste || '-'}</span>`;
                memHtml += `<span class="key">语气变化</span><span class="value">${mem.tone_shift ? '是' : '否'}</span>`;
                memHtml += '</div>';
                if (mem.recent_messages && mem.recent_messages.length) {
                    memHtml += '<div style="margin-top:8px;"><strong style="font-size:12px;color:#888;">最近对话：</strong></div>';
                    mem.recent_messages.forEach(m => {
                        memHtml += `<div style="font-size:12px;padding:2px 0;"><span style="color:#1976d2;">${m.role}:</span> ${escapeHtml((m.content || '').substring(0, 80))}</div>`;
                    });
                }
                memContainer.innerHTML = memHtml;
            } else {
                memContainer.innerHTML = '<span style="color:#888;">无记忆注入</span>';
            }

            // MCP 服务
            const mcpContainer = document.getElementById('debugMCP');
            let mcpHtml = `<div class="mcp-status" style="margin-bottom:8px;">
                <span class="dot ${debug.mcp_connected ? 'green' : 'red'}"></span>
                ${debug.mcp_connected ? 'MCP 已连接' : 'MCP 未连接'}
            </div>`;
            if (debug.mcp_calls && debug.mcp_calls.length) {
                mcpHtml += '<table class="mcp-table"><thead><tr><th>工具</th><th>参数</th><th>结果</th><th>耗时</th><th>状态</th></tr></thead><tbody>';
                debug.mcp_calls.forEach(c => {
                    const statusIcon = c.success ? '✅' : '❌';
                    mcpHtml += `<tr>
                        <td><strong>${c.tool}</strong></td>
                        <td style="max-width:250px;word-break:break-all;">${escapeHtml(c.args_summary || '')}</td>
                        <td style="max-width:200px;word-break:break-all;">${escapeHtml(c.result_summary || '')}</td>
                        <td>${c.duration_ms}ms</td>
                        <td>${statusIcon}</td>
                    </tr>`;
                });
                mcpHtml += '</tbody></table>';
            } else {
                mcpHtml += '<div style="color:#888;font-size:12px;">无 MCP 调用记录</div>';
            }
            mcpContainer.innerHTML = mcpHtml;

            // 记忆提取
            const extContainer = document.getElementById('debugExtraction');
            const ext = debug.extraction;
            if (ext) {
                let extHtml = '<div class="extraction-card">';
                extHtml += '<div class="debug-kv">';
                extHtml += `<span class="key">提取来源</span><span class="value">${ext.source || '-'}</span>`;
                extHtml += `<span class="key">情绪</span><span class="value">${ext.emotion || '-'}</span>`;
                extHtml += `<span class="key">标签</span><span class="value"><span class="tag-list">${(ext.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</span></span>`;
                extHtml += `<span class="key">场景倾向</span><span class="value">${ext.scene_hint || '-'}</span>`;
                extHtml += `<span class="key">有里程碑</span><span class="value">${ext.has_milestone ? '是' : '否'}</span>`;
                if (ext.has_milestone && ext.milestone_content) {
                    extHtml += `<span class="key">里程碑内容</span><span class="value">${escapeHtml(ext.milestone_content)}</span>`;
                    extHtml += `<span class="key">里程碑重要性</span><span class="value">${ext.milestone_importance || '-'}</span>`;
                }
                extHtml += '</div></div>';
                extContainer.innerHTML = extHtml;
            } else {
                extContainer.innerHTML = '<span style="color:#888;">无记忆提取结果</span>';
            }

            // 滚动到调试面板
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 初始化
        initSession();
        initImageUpload();
    </script>
