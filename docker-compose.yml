version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://kuakua:kuakua123@db:5432/kuakua}
      - MODELSCOPE_API_KEY=${MODELSCOPE_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-https://api-inference.modelscope.cn/v1}
      - AI_MODEL=${AI_MODEL:-deepseek-ai/DeepSeek-V3.2}
      - AI_VISION_MODEL=${AI_VISION_MODEL:-Qwen/Qwen2.5-VL-72B-Instruct}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-changeme}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kuakua
      POSTGRES_USER: kuakua
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kuakua123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuakua"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
