name: Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # 代码检查和测试
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check app/

      - name: MyPy check
        run: mypy app/
        continue-on-error: true

  # 部署到腾讯云 Lighthouse
  deploy:
    needs: lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            # 确保 SSH 密钥存在并验证 GitHub 连接
            if [ ! -f "$HOME/.ssh/id_ed25519" ]; then
              echo ">> 生成 SSH 密钥..."
              ssh-keygen -t ed25519 -C "deploy@kuakua-agent" -f $HOME/.ssh/id_ed25519 -N ""
              echo ">> 请将以下公钥添加到 GitHub Deploy Keys（Settings -> Deploy keys）："
              cat $HOME/.ssh/id_ed25519.pub
            fi
            ssh-keyscan github.com >> $HOME/.ssh/known_hosts 2>/dev/null
            ssh -T -o StrictHostKeyChecking=accept-new git@github.com 2>&1 || true

            # 首次部署时自动初始化目录
            if [ ! -d "$HOME/kuakua-agent/.git" ]; then
              echo ">> 首次部署，初始化目录..."
              mkdir -p $HOME/kuakua-agent
              git clone git@github.com:${{ github.repository }}.git $HOME/kuakua-agent
            fi

            cd $HOME/kuakua-agent

            # 强制使用 SSH（国内 HTTPS 连 GitHub 不稳定）
            git remote set-url origin git@github.com:${{ github.repository }}.git

            # 拉取最新代码
            git pull origin main

            # 停止旧容器，重新构建并启动
            docker compose down --remove-orphans
            sleep 2
            docker compose up -d --build app

            # 等待健康检查
            sleep 10
            curl -f http://localhost:8080/health || exit 1

            # 清理旧镜像
            docker image prune -f

  # 部署测试环境
  deploy-staging:
    needs: lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Deploy staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            # 确保 SSH 密钥存在并验证 GitHub 连接
            if [ ! -f "$HOME/.ssh/id_ed25519" ]; then
              echo ">> 生成 SSH 密钥..."
              ssh-keygen -t ed25519 -C "deploy@kuakua-agent" -f $HOME/.ssh/id_ed25519 -N ""
              echo ">> 请将以下公钥添加到 GitHub Deploy Keys（Settings -> Deploy keys）："
              cat $HOME/.ssh/id_ed25519.pub
            fi
            ssh-keyscan github.com >> $HOME/.ssh/known_hosts 2>/dev/null
            ssh -T -o StrictHostKeyChecking=accept-new git@github.com 2>&1 || true

            # 首次部署时自动初始化目录
            if [ ! -d "$HOME/kuakua-agent-staging/.git" ]; then
              echo ">> 首次部署，初始化目录..."
              mkdir -p $HOME/kuakua-agent-staging
              git clone git@github.com:${{ github.repository }}.git $HOME/kuakua-agent-staging
            fi

            cd $HOME/kuakua-agent-staging

            # 强制使用 SSH（国内 HTTPS 连 GitHub 不稳定）
            git remote set-url origin git@github.com:${{ github.repository }}.git

            git fetch origin develop
            git checkout develop
            git pull origin develop

            docker compose down --remove-orphans
            sleep 2
            APP_PORT=8081 docker compose up -d --build app

            echo "Staging environment deployed on port 8081"
